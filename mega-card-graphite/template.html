<title>MEGA Card — Graphite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root{
    --stage:#0C0D10; --card-hi:#20232B; --card-lo:#0E0F12;
    --line:#2A2E37; --line-soft:#20242C;
    --brass:#C6A15B; --brass-hi:#E7CE9B; --brass-dim:#8A6E3C;
    --text:#ECEDEF; --muted:#9BA0A8; --faint:#6B7078;
    --good:#8FB98A; --mid:#D8B36A; --bad:#D08A6E;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--stage); color:var(--text);
    font-family:Inter,system-ui,sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(120% 90% at 50% -10%, #16181D 0%, var(--stage) 55%); min-height:100vh;
  }
  .wrap{max-width:900px; margin:0 auto; padding:40px 20px 64px; display:flex; flex-direction:column; gap:28px}
  .eyebrow{font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--faint)}
  .lede h1.pagetitle{font-family:"JetBrains Mono",monospace; font-weight:500; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:6px 0 0}
  .grid{display:grid; grid-template-columns:minmax(320px,380px) 1fr; gap:28px; align-items:start}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}

  .card{position:relative; border-radius:18px; padding:22px 22px 16px;
    background:linear-gradient(160deg, var(--card-hi) 0%, var(--card-lo) 62%);
    border:1px solid var(--brass-dim); box-shadow:0 1px 0 rgba(231,206,155,.18) inset, 0 24px 60px -30px #000; overflow:hidden}
  .card::before{content:""; position:absolute; inset:0; pointer-events:none; border-radius:18px;
    background:linear-gradient(115deg, transparent 30%, rgba(231,206,155,.10) 47%, transparent 64%);
    background-size:280% 280%; animation:sheen 9s ease-in-out infinite}
  @keyframes sheen{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}
  @media(prefers-reduced-motion:reduce){.card::before{animation:none}}
  .card > *{position:relative}
  .cardtop{display:flex; justify-content:space-between; align-items:flex-start; gap:12px}
  .rating{display:flex; flex-direction:column; align-items:center; line-height:.82}
  .rating .num{font-family:Anton,Impact,sans-serif; font-size:74px; color:var(--brass-hi)}
  .rating .lbl{font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.28em; color:var(--muted); margin-top:9px}
  .rating .pos{margin-top:9px; font-family:"JetBrains Mono",monospace; font-size:11px; font-weight:700; letter-spacing:.14em; color:#12130f; background:var(--brass); padding:3px 9px; border-radius:4px}
  .issuer{text-align:right; display:flex; flex-direction:column; gap:7px; align-items:flex-end; padding-top:4px}
  .issuer .mega{font-family:Anton,sans-serif; font-size:22px; letter-spacing:.16em; color:var(--text)}
  .issuer .tag{font-family:"JetBrains Mono",monospace; font-size:9.5px; letter-spacing:.2em; color:var(--faint); text-transform:uppercase}
  .issuer .edition{font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.12em; color:var(--brass)}
  .radarwrap{display:flex; justify-content:center; margin:6px 0 2px}
  svg.radar{width:100%; max-width:360px; height:auto; display:block}
  .radar text{font-family:"JetBrains Mono",monospace; fill:var(--faint)}
  .name{font-family:Anton,sans-serif; font-size:30px; letter-spacing:.03em; text-align:center; color:var(--brass-hi); margin:6px 0 0; text-transform:uppercase; text-wrap:balance}
  .holder{font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--brass); text-align:center; margin:7px 0 0}
  .tagline{font-size:12.5px; color:var(--muted); text-align:center; max-width:46ch; margin:8px auto 0; text-wrap:balance}
  .rule{height:1px; background:linear-gradient(90deg,transparent,var(--brass-dim),transparent); margin:16px 0 12px}
  .stats{display:grid; gap:2px}
  .stat{text-align:center; padding:4px 2px}
  .stat .v{font-family:Anton,sans-serif; font-size:23px; color:var(--text); line-height:1}
  .stat .k{font-family:"JetBrains Mono",monospace; font-size:9px; letter-spacing:.12em; color:var(--muted); margin-top:5px}
  .foil{margin-top:14px; text-align:center; font-family:"JetBrains Mono",monospace; font-size:9.5px; letter-spacing:.13em; color:var(--brass-dim); text-transform:uppercase}

  .report{display:flex; flex-direction:column; gap:20px}
  .stat-summary{font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--muted); letter-spacing:.04em; text-transform:uppercase}
  .block h2{font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--faint); margin:0 0 10px; font-weight:500}
  .rows{display:flex; flex-direction:column; gap:7px}
  .row{display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; font-size:13px}
  .row .rn{color:var(--text)}
  .row .rv{font-family:"JetBrains Mono",monospace; font-weight:700}
  .bar{grid-column:1/3; height:3px; border-radius:2px; background:var(--line-soft); overflow:hidden}
  .bar > i{display:block; height:100%; border-radius:2px}
  .row.na .rv{color:var(--faint)} .row.na .rn{color:var(--muted)}
  .bands{display:flex; gap:16px; flex-wrap:wrap}
  .bands .sw{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--muted)}
  .bands .dot{width:9px; height:9px; border-radius:50%; flex:none}
  .keynote{font-size:11.5px; color:var(--faint); margin:9px 0 0}
  .keynote b{color:var(--good)}
  .legend{border-top:1px solid var(--line-soft); padding-top:16px}
  .legend-grid{display:grid; grid-template-columns:1fr 1fr; gap:4px 20px}
  @media(max-width:420px){.legend-grid{grid-template-columns:1fr}}
  .lg{display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:baseline; font-size:12px; padding:2px 0}
  .lg .id{font-family:"JetBrains Mono",monospace; font-size:10px; color:var(--faint)}
  .lg .nm{color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .lg .vv{font-family:"JetBrains Mono",monospace; color:var(--text); font-variant-numeric:tabular-nums}
  .lg .lo{color:var(--faint); font-family:"JetBrains Mono",monospace; font-size:8.5px; letter-spacing:.08em; margin-left:5px}
  .footer-note{font-size:11px; color:var(--faint); line-height:1.5; border-top:1px solid var(--line-soft); padding-top:14px}
  .footer-note code{font-family:"JetBrains Mono",monospace; color:var(--muted)}
</style>

<div class="wrap">
  <div class="lede">
    <div class="eyebrow" id="eyebrow">MEGA Assessment · Player Card</div>
    <h1 class="pagetitle" id="pagetitle">Skill web — 24 traits, one card</h1>
  </div>
  <div class="grid">
    <div class="card" id="card" role="img" aria-label="MEGA player card"></div>
    <div class="report" id="report"></div>
  </div>
</div>

<script>
/*__DATA__*/
(function(){
  const D = (typeof DATA !== "undefined" && DATA) ? DATA : {
    name:"SAMPLE", date:"2026-01-01", foot:"— episodes · — sessions · — days",
    traits:{T01:[10,9,0],T02:[10,10,0],T03:[4,3,0],T04:[8,8,0],T05:[9,8,1],T06:[9,6,0],
      T07:[6,5,0],T08:[7,6,0],T09:[9,8,0],T10:[4,4,0],T11:[4,3,0],T12:[6,6,0],
      T13:[5,3,0],T14:[4,2,0],T15:[6,4,0],T16:[5,5,0],T17:[2,1,0],T18:[10,9,0],
      T19:[2,2,0],T20:[6,5,0],T21:[8,7,0],T22:[7,6,0],T23:[9,9,0],T24:[6,5,0]}
  };
  const NAMES={T01:"Intent Clarity",T02:"Problem Framing",T03:"Agent State Modeling",T04:"Context Anchoring",
    T05:"Constraint Precision",T06:"Falsifiable Acceptance",T07:"Problem Understanding First",T08:"Root-Cause Orientation",
    T09:"Evidence Injection",T10:"Progressive Disclosure",T11:"Context Economy",T12:"Durable Memory",
    T13:"Inspect-Before-Edit",T14:"Capability Provisioning",T15:"Delegation Judgment",T16:"Decomposition Skill",
    T17:"Agent Brief Quality",T18:"Decision Rights",T19:"Parallelism Hygiene",T20:"Result Integration",
    T21:"Feedback Specificity",T22:"Steering & Trust",T23:"Verification Closure",T24:"Recovery & Learning"};
  // canonical MEGA 5-pillar grouping (from the MEGA trait reference)
  const PILLARS=[
    ["DIR","Direction",["T01","T02","T05","T06"]],
    ["CTX","Context",["T04","T09","T10","T11","T12"]],
    ["GND","Ground",["T03","T07","T13","T14"]],
    ["ORC","Orchestration",["T15","T16","T17","T19","T20"]],
    ["PRF","Proof",["T08","T18","T21","T22","T23","T24"]]
  ];
  const IDS=Array.from({length:24},(_,i)=>"T"+String(i+1).padStart(2,"0"));
  const band=v => v>=70?"var(--good)":v>=50?"var(--mid)":"var(--bad)";
  const bandHex=v => v>=70?"#8FB98A":v>=50?"#D8B36A":"#D08A6E";

  const R = IDS.map(id=>{
    const t=D.traits[id]||[0,0,0]; const [e,a,d]=t;
    const measured=e>=3;
    const score=e>0?Math.round((a+d)/e*100):0;
    return {id, e, score, measured, name:NAMES[id]};
  });
  const byId=Object.fromEntries(R.map(r=>[r.id,r]));
  const meas=R.filter(r=>r.measured);
  const overall=Math.round(meas.reduce((s,r)=>s+r.score,0)/meas.length);
  const tier = overall>=75?"GOLD TIER":overall>=65?"SILVER TIER":"BRONZE TIER";
  const pillars=PILLARS.map(([code,label,ids])=>{
    const ms=ids.map(i=>byId[i]).filter(r=>r.measured);
    return {code,label,score:Math.round(ms.reduce((s,r)=>s+r.score,0)/ms.length)};
  });
  const topPillar=pillars.slice().sort((x,y)=>y.score-x.score)[0].code;
  const pos = D.position || topPillar;
  const tagline = D.tagline || (tier.toLowerCase().replace(" tier","")+" card · "+meas.length+" of 24 traits measured");
  const edition = (D.version?D.version+" · ":"") + (D.mint?("MINT "+D.mint):"");
  const foilLine = [(D.version||"AP1@1.0.0"), (D.mint?("MINT "+D.mint):null), D.name, "MEGA"].filter(Boolean).join(" · ");

  // ---- CARD ----
  const radarId="radar";
  document.getElementById("card").innerHTML=
    '<div class="cardtop">'+
      '<div class="rating"><span class="num">'+overall+'</span><span class="lbl">OVERALL</span><span class="pos">'+pos+'</span></div>'+
      '<div class="issuer"><span class="mega">MEGA</span><span class="tag">'+tier+'</span>'+(edition?'<span class="edition">'+edition+'</span>':'')+'</div>'+
    '</div>'+
    '<div class="radarwrap"><svg class="radar" id="'+radarId+'" viewBox="0 0 460 460" aria-hidden="true"></svg></div>'+
    '<div class="name">'+(D.archetype||D.name||"—")+'</div>'+
    ((D.archetype && D.name) ? '<div class="holder">'+D.name+'</div>' : "")+
    '<p class="tagline">'+tagline+'</p>'+
    '<div class="rule"></div>'+
    '<div class="stats" style="grid-template-columns:repeat('+pillars.length+',1fr)">'+
      pillars.map(p=>'<div class="stat"><div class="v">'+p.score+'</div><div class="k">'+p.code+'</div></div>').join("")+
    '</div>'+
    '<div class="foil">'+foilLine+'</div>';

  // ---- RADAR ----
  const SVGNS="http://www.w3.org/2000/svg", cx=230, cy=230, RAD=150, N=24;
  const svg=document.getElementById(radarId);
  const pt=(i,r)=>{const ang=(-90+i*(360/N))*Math.PI/180; return [cx+r*Math.cos(ang), cy+r*Math.sin(ang)];};
  const el=(n,at)=>{const x=document.createElementNS(SVGNS,n); for(const k in at) x.setAttribute(k,at[k]); return x;};
  [0.25,0.5,0.75,1].forEach(f=>{let d="";for(let i=0;i<N;i++){const[x,y]=pt(i,RAD*f);d+=(i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)+" ";}
    svg.appendChild(el("path",{d:d+"Z",fill:"none",stroke:"#262A32","stroke-width":f===1?1.2:0.8}));});
  R.forEach((r,i)=>{const[x,y]=pt(i,RAD);
    svg.appendChild(el("line",{x1:cx,y1:cy,x2:x,y2:y,stroke:"#22252D","stroke-width":.8,"stroke-dasharray":r.measured?"none":"2 3"}));
    const[lx,ly]=pt(i,RAD+16); const tx=el("text",{x:lx.toFixed(1),y:(ly+3).toFixed(1),"text-anchor":"middle","font-size":"9"});
    tx.textContent=r.id.slice(1); svg.appendChild(tx);});
  const poly=R.filter(r=>r.measured).map((r)=>{const idx=IDS.indexOf(r.id); const[x,y]=pt(idx,RAD*Math.min(r.score,100)/100); return x.toFixed(1)+","+y.toFixed(1);});
  svg.appendChild(el("polygon",{points:poly.join(" "),fill:"rgba(198,161,91,.13)",stroke:"#C6A15B","stroke-width":2,"stroke-linejoin":"round"}));
  R.forEach((r,i)=>{const[x,y]=pt(i,RAD*Math.min(r.score,100)/100);
    if(r.measured) svg.appendChild(el("circle",{cx:x,cy:y,r:3,fill:bandHex(r.score),stroke:"#12130f","stroke-width":.5}));
    else svg.appendChild(el("circle",{cx:x,cy:y,r:3.6,fill:"none",stroke:"#6B7078","stroke-width":1.3,"stroke-dasharray":"2 2"}));});

  // ---- REPORT ----
  const rowHTML=r=>{const c=band(r.score);
    return '<div class="row"><span class="rn">'+r.name+'</span><span class="rv" style="color:'+c+'">'+r.score+'</span>'+
      '<span class="bar"><i style="width:'+Math.min(r.score,100)+'%;background:'+c+'"></i></span></div>';};
  const strengths=meas.slice().sort((a,b)=>b.score-a.score).slice(0,6);
  const growth=meas.slice().sort((a,b)=>a.score-b.score).slice(0,5);
  const low=R.filter(r=>!r.measured);
  document.getElementById("eyebrow").textContent="MEGA Assessment"+(D.date?" · SCAN "+D.date:"");
  document.getElementById("pagetitle").textContent="How "+(D.name||"you")+" work"+(D.name?"s":"")+" with agents — one card";
  document.getElementById("report").innerHTML=
    '<div class="stat-summary">'+(D.foot||"")+'</div>'+
    '<div class="block"><h2>Colour key — score band</h2><div class="bands">'+
      '<span class="sw"><span class="dot" style="background:#8FB98A"></span>Strong · 70+</span>'+
      '<span class="sw"><span class="dot" style="background:#D8B36A"></span>Middle · 50–69</span>'+
      '<span class="sw"><span class="dot" style="background:#D08A6E"></span>To improve · below 50</span></div>'+
      '<p class="keynote">Dots are coloured by absolute band. "Top form" and "weak foot" below are your <em>relative</em> best and worst, so a weak-foot trait can still be green.</p></div>'+
    '<div class="block"><h2>Top form — strengths</h2><div class="rows">'+strengths.map(rowHTML).join("")+'</div></div>'+
    '<div class="block"><h2>Weak foot — growth edges</h2><div class="rows">'+growth.map(rowHTML).join("")+'</div></div>'+
    (low.length?'<div class="block"><h2>Not enough minutes — low data</h2><div class="rows">'+
      low.map(r=>'<div class="row na"><span class="rn">'+r.name+' <span class="lo">'+r.e+' EP</span></span><span class="rv">~'+r.score+'</span></div>').join("")+
      '</div><p class="keynote" style="color:var(--faint)">Under 3 eligible episodes — below MEGA\'s bar to be "measured," so left off the score and bands. Provisional.</p></div>':'')+
    '<div class="legend"><h2 style="font-family:\'JetBrains Mono\',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin:0 0 10px;font-weight:500">All 24 traits</h2>'+
      '<div class="legend-grid">'+R.map(r=>'<div class="lg'+(r.measured?"":" dim")+'"><span class="id">'+r.id.slice(1)+'</span><span class="nm">'+r.name+'</span>'+
        (r.measured?'<span class="vv" style="color:'+bandHex(r.score)+'">'+r.score+'</span>':'<span class="vv">~'+r.score+'<span class="lo">LOW</span></span>')+'</div>').join("")+'</div></div>'+
    '<p class="footer-note">Trait score = <code>(applied + declined) / eligible × 100</code> (a deliberate skip counts as a plus). Overall = mean of the '+meas.length+' measured traits. Model-judged from session history — well-grounded estimates, not audited figures. Graphite variant of piotrkrych2/Random-Skills · mega-card.</p>';
})();
</script>
